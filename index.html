<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Minecraft Skin Pixler — 64×64</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{--bg:#071022;--panel:#0f1724;--muted:#9fb0d6;--accent:#4fc3f7;--card:#0b1220}
  *{box-sizing:border-box;font-family:Inter,system-ui,Segoe UI,Arial}
  body{margin:0;background:linear-gradient(180deg,#071022 0,#02030a 100%);color:#eaf2ff;display:flex;align-items:flex-start;justify-content:center;padding:20px}
  .wrap{display:grid;grid-template-columns:320px 1fr 360px;gap:16px;width:100%;max-width:1300px}
  .panel{background:linear-gradient(180deg,var(--panel),#07101a);border-radius:12px;padding:14px;border:1px solid rgba(255,255,255,0.03)}
  h1{margin:0 0 8px;font-size:18px}
  .palette{display:flex;flex-wrap:wrap;gap:6px}
  .sw{width:28px;height:28px;border-radius:6px;cursor:pointer;border:1px solid rgba(0,0,0,0.4)}
  #editorCanvas{width:512px;height:512px;image-rendering:pixelated;border-radius:10px;border:1px solid rgba(255,255,255,0.04);cursor:crosshair}
  .controls{display:flex;gap:8px;margin-top:8px}
  .btn{padding:8px 12px;border-radius:8px;background:linear-gradient(180deg,var(--accent),#0288d1);border:none;color:#042033;cursor:pointer}
  .btn.secondary{background:#0b1220;color:var(--muted);border:1px solid rgba(255,255,255,0.03)}
  /* 3D */
  .scene{width:320px;height:320px;perspective:1000px;display:flex;align-items:center;justify-content:center}
  .model{width:220px;height:220px;transform-style:preserve-3d;transition:transform 0.02s linear}
  .face{position:absolute;width:220px;height:220px;background-size:cover;background-position:center;border-radius:6px;box-shadow:inset 0 0 30px rgba(0,0,0,0.6)}
  .f-front{transform:translateZ(110px)}
  .f-back{transform:rotateY(180deg) translateZ(110px)}
  .f-right{transform:rotateY(90deg) translateZ(110px)}
  .f-left{transform:rotateY(-90deg) translateZ(110px)}
  .f-top{transform:rotateX(90deg) translateZ(110px)}
  .f-bottom{transform:rotateX(-90deg) translateZ(110px)}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  @media(max-width:1000px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="wrap">
    <!-- LEFT: Palette & Actions -->
    <div class="panel">
      <h1>Farben & Aktionen</h1>
      <div class="palette" id="palette"></div>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
        <input id="colorPicker" type="color" value="#ffcc00" />
        <button class="btn" id="mirrorBtn">Spiegeln aus</button>
        <button class="btn secondary" id="clearBtn">Leeren</button>
      </div>
      <div class="controls" style="margin-top:12px">
        <button class="btn" id="downloadBtn">Skin herunterladen</button>
      </div>
      <div class="hint">Nutze Drag zum Malen. 64×64 Minecraft‑Skin‑Layout wird verwendet. </div>
    </div>

    <!-- CENTER: 2D Editor -->
    <div class="panel" style="display:flex;flex-direction:column;align-items:center">
      <h1>2D Pixel Editor (64×64)</h1>
      <canvas id="editorCanvas" width="512" height="512"></canvas>
      <div class="hint">Klicke oder ziehe, um Pixel zu setzen. Rechts: 3D Vorschau (drehen mit Maus).</div>
    </div>

    <!-- RIGHT: 3D Preview -->
    <div class="panel" style="display:flex;flex-direction:column;align-items:center">
      <h1>3D Vorschau</h1>
      <div class="scene" id="scene">
        <div class="model" id="model">
          <div class="face f-front" id="f-front"></div>
          <div class="face f-back" id="f-back"></div>
          <div class="face f-right" id="f-right"></div>
          <div class="face f-left" id="f-left"></div>
          <div class="face f-top" id="f-top"></div>
          <div class="face f-bottom" id="f-bottom"></div>
        </div>
      </div>
      <div class="hint">Drag: drehen • Mausrad: zoomen</div>
    </div>
  </div>

<script>
/* Core: 64x64 skin canvas */
const SKIN = 64;
const skin = document.createElement('canvas'); skin.width=SKIN; skin.height=SKIN;
const sctx = skin.getContext('2d');
sctx.clearRect(0,0,SKIN,SKIN);

/* visible editor scaled */
const editor = document.getElementById('editorCanvas'), ectx = editor.getContext('2d');
const scale = editor.width / SKIN;
editor.style.imageRendering='pixelated';

/* palette */
const paletteColors = ['#000000','#ffffff','#7f7f7f','#c0392b','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6','#d35400'];
const palette = document.getElementById('palette');
let currentColor = '#ffcc00';
paletteColors.forEach(c=>{const d=document.createElement('div');d.className='sw';d.style.background=c;d.onclick=()=>{currentColor=c;document.getElementById('colorPicker').value=c};palette.appendChild(d)});
document.getElementById('colorPicker').addEventListener('input',e=>currentColor=e.target.value);

/* draw grid from skin */
function redraw(){ ectx.clearRect(0,0,editor.width,editor.height); ectx.drawImage(skin,0,0,SKIN,SKIN,0,0,editor.width,editor.height);
 ectx.strokeStyle='rgba(255,255,255,0.06)'; ectx.lineWidth=1;
 for(let i=0;i<=SKIN;i++){ const p=i*scale+0.5; ectx.beginPath(); ectx.moveTo(p,0); ectx.lineTo(p,editor.height); ectx.stroke(); ectx.beginPath(); ectx.moveTo(0,p); ectx.lineTo(editor.width,p); ectx.stroke(); } updateModelFaces(); }

/* set pixel */
function setPixel(px,py,color){ sctx.fillStyle=color; sctx.fillRect(px,py,1,1); redraw(); }

/* mouse painting */
let painting=false;
editor.addEventListener('mousedown',e=>{painting=true;paintAt(e)});
window.addEventListener('mouseup',()=>painting=false);
editor.addEventListener('mousemove',e=>{ if(painting) paintAt(e) });
function paintAt(e){ const r=editor.getBoundingClientRect(); const x=(e.clientX-r.left)*(editor.width/r.width); const y=(e.clientY-r.top)*(editor.height/r.height);
 const px=Math.floor(x/scale), py=Math.floor(y/scale); setPixel(px,py,currentColor); }

/* clear & download */
document.getElementById('clearBtn').onclick=()=>{ sctx.clearRect(0,0,SKIN,SKIN); redraw(); }
document.getElementById('downloadBtn').onclick=()=>{
  const a=document.createElement('a'); a.href=skin.toDataURL('image/png'); a.download='skin.png'; document.body.appendChild(a); a.click(); a.remove();
}

/* 3D model mapping: crop regions for cube faces from skin canvas.
   For simplicity map the full skin as texture on each face but crop can be refined to exact head/body/arm/leg regions per template. */
function updateModelFaces(){
  const dataURL = skin.toDataURL();
  ['f-front','f-back','f-right','f-left','f-top','f-bottom'].forEach(id=>{
    document.getElementById(id).style.backgroundImage = `url(${dataURL})`;
  });
}

/* interactive rotation & zoom */
const model = document.getElementById('model'), scene=document.getElementById('scene');
let rotX=-18, rotY=0, zoom=1;
let dragging=false, lastX=0,lastY=0;
scene.addEventListener('mousedown',e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
window.addEventListener('mouseup',()=>dragging=false);
window.addEventListener('mousemove',e=>{ if(!dragging) return; const dx=e.clientX-lastX, dy=e.clientY-lastY; rotY += dx*0.3; rotX += dy*0.3; lastX=e.clientX; lastY=e.clientY; applyTransform(); });
scene.addEventListener('wheel',e=>{ e.preventDefault(); zoom = Math.min(2.2, Math.max(0.6, zoom - e.deltaY*0.0015)); applyTransform(); },{passive:false});
function applyTransform(){ model.style.transform = `scale(${zoom}) rotateX(${rotX}deg) rotateY(${rotY}deg)`; }

/* init */
redraw(); applyTransform();
</script>
</body>
</html>
