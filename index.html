<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Minecraft Skin Editor – 64×64</title>

<style>
  :root{
    --bg:#071022;
    --card:#0f1724;
    --muted:#9fb0d6;
    --accent:#4fc3f7;
  }

  *{box-sizing:border-box;font-family:Inter,system-ui,Segoe UI,Arial}

  body{
    margin:0;
    background:linear-gradient(180deg,#071022,#02030a);
    color:#eaf2ff;
    display:flex;
    justify-content:center;
    padding:18px;
  }

  .app{
    width:100%;
    max-width:1400px;
    display:grid;
    grid-template-columns:260px 1fr 200px;
    gap:16px;
  }

  .card{
    background:linear-gradient(180deg,var(--card),#07101a);
    border-radius:12px;
    padding:14px;
    border:1px solid rgba(255,255,255,0.04);
  }

  h1{margin:0 0 8px;font-size:16px}

  #editor{
    width:640px;
    height:640px;
    image-rendering:pixelated;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
    background:#0b1220;
    display:block;
    cursor:crosshair;
  }

  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

  .btn{
    padding:8px 10px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    background:linear-gradient(180deg,var(--accent),#0288d1);
    color:#042033;
  }

  .btn.alt{
    background:#0b1220;
    color:var(--muted);
    border:1px solid rgba(255,255,255,0.08);
  }

  #colorField{
    width:140px;
    height:80px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.15);
    cursor:crosshair;
  }

  #colorPreview{
    width:32px;
    height:32px;
    border-radius:6px;
    border:1px solid rgba(255,255,255,0.3);
    background:#ffcc00;
  }

  #hoverInfo{
    font-size:14px;
    margin-bottom:6px;
    color:#4fc3f7;
    height:18px;
  }
</style>
</head>

<body>

<div class="app">

  <!-- LEFT -->
  <div class="card">
    <h1>Werkzeuge</h1>

    <div class="row">
      <button class="btn alt" id="brushBtn">Pinsel</button>
      <button class="btn alt" id="eraserBtn">Radierer (Shift)</button>
    </div>

    <div class="row">
      <button class="btn alt" id="mirrorBtn">Spiegel: Aus</button>
      <button class="btn alt" id="overlayBtn">Overlay: Aus</button>
    </div>

    <div class="row">
      <input id="colorPicker" type="color" value="#ffcc00" />
      <div id="colorPreview"></div>
    </div>

    <div class="row">
      <canvas id="colorField"></canvas>
    </div>

    <div class="row">
      <button class="btn" id="clearBtn">Leeren</button>
      <button class="btn" id="downloadBtn">Download</button>
    </div>

    <h1>Drehen</h1>
    <div class="row">
      <button class="btn alt" id="rotLeft">←</button>
      <button class="btn alt" id="rotRight">→</button>
    </div>
  </div>

  <!-- CENTER -->
  <div class="card">
    <div id="hoverInfo"></div>
    <canvas id="editor" width="640" height="640"></canvas>
  </div>

  <!-- RIGHT -->
  <div class="card">
    <h1>Info</h1>
    <p>• Nur echte Skin‑Flächen bemalbar<br>
       • Hover zeigt Teil oben<br>
       • Pfeile drehen den Skin<br>
       • Farbfeld wie vorher</p>
  </div>

</div>

<script>
/* ============================================================
   SETUP
   ============================================================ */

const SKIN_SIZE = 64;
const editor = document.getElementById("editor");
const ectx = editor.getContext("2d");

const skin = document.createElement("canvas");
skin.width = SKIN_SIZE;
skin.height = SKIN_SIZE;
const sctx = skin.getContext("2d");

const overlay = document.createElement("canvas");
overlay.width = SKIN_SIZE;
overlay.height = SKIN_SIZE;
const octx = overlay.getContext("2d");

let viewScale = editor.width / SKIN_SIZE;
let painting = false;
let tool = "brush";
let mirror = false;
let overlayEnabled = false;
let currentColor = "#ffcc00";
let rotation = 0; // 0=Front,1=Right,2=Back,3=Left

const hoverInfo = document.getElementById("hoverInfo");

/* ============================================================
   ECHTES MINECRAFT‑LAYOUT (A1)
   ============================================================ */

const BASE_AREAS = [
  { part:"Head", face:"Top",    x:8,  y:0,  w:8, h:8 },
  { part:"Head", face:"Bottom", x:16, y:0,  w:8, h:8 },
  { part:"Head", face:"Left",   x:0,  y:8,  w:8, h:8 },
  { part:"Head", face:"Front",  x:8,  y:8,  w:8, h:8 },
  { part:"Head", face:"Right",  x:16, y:8,  w:8, h:8 },
  { part:"Head", face:"Back",   x:24, y:8,  w:8, h:8 },

  { part:"Body", face:"Top",    x:20, y:16, w:8, h:4 },
  { part:"Body", face:"Bottom", x:28, y:16, w:8, h:4 },
  { part:"Body", face:"Left",   x:16, y:20, w:4, h:12 },
  { part:"Body", face:"Front",  x:20, y:20, w:8, h:12 },
  { part:"Body", face:"Right",  x:28, y:20, w:4, h:12 },
  { part:"Body", face:"Back",   x:32, y:20, w:8, h:12 },

  { part:"Right Arm", face:"Top",    x:44, y:16, w:4, h:4 },
  { part:"Right Arm", face:"Bottom", x:48, y:16, w:4, h:4 },
  { part:"Right Arm", face:"Left",   x:40, y:20, w:4, h:12 },
  { part:"Right Arm", face:"Front",  x:44, y:20, w:4, h:12 },
  { part:"Right Arm", face:"Right",  x:48, y:20, w:4, h:12 },
  { part:"Right Arm", face:"Back",   x:52, y:20, w:4, h:12 },

  { part:"Left Arm", face:"Top",    x:36, y:48, w:4, h:4 },
  { part:"Left Arm", face:"Bottom", x:40, y:48, w:4, h:4 },
  { part:"Left Arm", face:"Left",   x:32, y:52, w:4, h:12 },
  { part:"Left Arm", face:"Front",  x:36, y:52, w:4, h:12 },
  { part:"Left Arm", face:"Right",  x:40, y:52, w:4, h:12 },
  { part:"Left Arm", face:"Back",   x:44, y:52, w:4, h:12 },

  { part:"Right Leg", face:"Top",    x:4,  y:16, w:4, h:4 },
  { part:"Right Leg", face:"Bottom", x:8,  y:16, w:4, h:4 },
  { part:"Right Leg", face:"Left",   x:0,  y:20, w:4, h:12 },
  { part:"Right Leg", face:"Front",  x:4,  y:20, w:4, h:12 },
  { part:"Right Leg", face:"Right",  x:8,  y:20, w:4, h:12 },
  { part:"Right Leg", face:"Back",   x:12, y:20, w:4, h:12 },

  { part:"Left Leg", face:"Top",    x:20, y:48, w:4, h:4 },
  { part:"Left Leg", face:"Bottom", x:24, y:48, w:4, h:4 },
  { part:"Left Leg", face:"Left",   x:16, y:52, w:4, h:12 },
  { part:"Left Leg", face:"Front",  x:20, y:52, w:4, h:12 },
  { part:"Left Leg", face:"Right",  x:24, y:52, w:4, h:12 },
  { part:"Left Leg", face:"Back",   x:28, y:52, w:4, h:12 },
];

/* ============================================================
   ROTATION (Front → Right → Back → Left)
   ============================================================ */

function rotatedAreas() {
  const map = {
    Front: ["Front","Right","Back","Left"],
    Right: ["Right","Back","Left","Front"],
    Back:  ["Back","Left","Front","Right"],
    Left:  ["Left","Front","Right","Back"]
  };

  return BASE_AREAS.map(a=>{
    if(["Front","Right","Back","Left"].includes(a.face)){
      return {
        ...a,
        face: map[a.face][rotation]
      };
    }
    return a;
  });
}

/* ============================================================
   FARBFELD
   ============================================================ */

const colorField = document.getElementById("colorField");
const cfCtx = colorField.getContext("2d");
const colorPreview = document.getElementById("colorPreview");

function drawColorField(){
  const w=colorField.width, h=colorField.height;

  const g1=cfCtx.createLinearGradient(0,0,w,0);
  g1.addColorStop(0,"red");
  g1.addColorStop(0.16,"yellow");
  g1.addColorStop(0.33,"lime");
  g1.addColorStop(0.5,"cyan");
  g1.addColorStop(0.66,"blue");
  g1.addColorStop(0.83,"magenta");
  g1.addColorStop(1,"red");
  cfCtx.fillStyle=g1;
  cfCtx.fillRect(0,0,w,h);

  const g2=cfCtx.createLinearGradient(0,0,0,h);
  g2.addColorStop(0,"white");
  g2.addColorStop(0.5,"transparent");
  g2.addColorStop(1,"black");
  cfCtx.fillStyle=g2;
  cfCtx.fillRect(0,0,w,h);
}
drawColorField();

function getColorFromField(x,y){
  const d=cfCtx.getImageData(x,y,1,1).data;
  return `rgb(${d[0]},${d[1]},${d[2]})`;
}

colorField.onmousemove=e=>{
  const r=colorField.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)*(colorField.width/r.width));
  const y=Math.floor((e.clientY-r.top)*(colorField.height/r.height));
  if(x>=0&&y>=0&&x<colorField.width&&y<colorField.height){
    colorPreview.style.background=getColorFromField(x,y);
  }
};

colorField.onmouseleave=()=>colorPreview.style.background=currentColor;

colorField.onclick=e=>{
  const r=colorField.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)*(colorField.width/r.width));
  const y=Math.floor((e.clientY-r.top)*(colorField.height/r.height));
  currentColor=getColorFromField(x,y);
  colorPreview.style.background=currentColor;
};

/* ============================================================
   ZEICHNEN
   ============================================================ */

function drawOutlines(ctx,scale,areas,hover){
  areas.forEach(a=>{
    const x=a.x*scale, y=a.y*scale, w=a.w*scale, h=a.h*scale;
    ctx.strokeStyle="rgba(255,255,255,0.35)";
    ctx.lineWidth=1.5;
    ctx.strokeRect(x,y,w,h);
    if(hover===a){
      ctx.fillStyle="rgba(80,160,255,0.25)";
      ctx.fillRect(x,y,w,h);
    }
  });
}

function redraw(){
  const areas=rotatedAreas();

  ectx.fillStyle="#0b1220";
  ectx.fillRect(0,0,editor.width,editor.height);

  ectx.imageSmoothingEnabled=false;
  ectx.drawImage(skin,0,0,SKIN_SIZE,SKIN_SIZE,0,0,editor.width,editor.height);

  ectx.globalAlpha=overlayEnabled?1:0.6;
  ectx.drawImage(overlay,0,0,SKIN_SIZE,SKIN_SIZE,0,0,editor.width,editor.height);
  ectx.globalAlpha=1;

  drawOutlines(ectx,viewScale,areas,hoverArea);
}

/* ============================================================
   HOVER
   ============================================================ */

function getHoverArea(px,py){
  const areas=rotatedAreas();
  return areas.find(a=>px>=a.x && px<a.x+a.w && py>=a.y && py<a.y+a.h) || null;
}

/* ============================================================
   MALEN
   ============================================================ */

function setPixel(px,py,color,useOverlay){
  if(px<0||py<0||px>=SKIN_SIZE||py>=SKIN_SIZE) return;
  const ctx=useOverlay?octx:sctx;
  if(color===null) ctx.clearRect(px,py,1,1);
  else{ctx.fillStyle=color;ctx.fillRect(px,py,1,1);}
}

function paintAt(e){
  const r=editor.getBoundingClientRect();
  const x=(e.clientX-r.left)*(editor.width/r.width);
  const y=(e.clientY-r.top)*(editor.height/r.height);

  const px=Math.floor(x/viewScale);
  const py=Math.floor(y/viewScale);

  const areas=rotatedAreas();
  const inside=areas.some(a=>px>=a.x && px<a.x+a.w && py>=a.y && py<a.y+a.h);
  if(!inside) return;

  const useOverlay=overlayEnabled;

  if(tool==="eraser"||e.shiftKey){
    setPixel(px,py,null,useOverlay);
    if(mirror) setPixel(SKIN_SIZE-1-px,py,null,useOverlay);
  }else{
    setPixel(px,py,currentColor,useOverlay);
    if(mirror) setPixel(SKIN_SIZE-1-px,py,currentColor,useOverlay);
  }

  redraw();
}

/* ============================================================
   EVENTS
   ============================================================ */

editor.onmousedown=e=>{painting=true;paintAt(e)};
window.onmouseup=()=>painting=false;

editor.onmousemove=e=>{
  const r=editor.getBoundingClientRect();
  const x=(e.clientX-r.left)*(editor.width/r.width);
  const y=(e.clientY-r.top)*(editor.height/r.height);

  const px=Math.floor(x/viewScale);
  const py=Math.floor(y/viewScale);

  hoverArea=getHoverArea(px,py);
  hoverInfo.textContent=hoverArea?`${hoverArea.part} – ${hoverArea.face}`:"";

  if(painting) paintAt(e);
  else redraw();
};

document.getElementById("brushBtn").onclick=()=>tool="brush";
document.getElementById("eraserBtn").onclick=()=>tool="eraser";

document.getElementById("mirrorBtn").onclick=()=>{
  mirror=!mirror;
  mirrorBtn.textContent="Spiegel: "+(mirror?"An":"Aus");
};

document.getElementById("overlayBtn").onclick=()=>{
  overlayEnabled=!overlayEnabled;
  overlayBtn.textContent="Overlay: "+(overlayEnabled?"An":"Aus");
  redraw();
};

document.getElementById("colorPicker").oninput=e=>{
  currentColor=e.target.value;
  colorPreview.style.background=currentColor;
};

document.getElementById("clearBtn").onclick=()=>{
  sctx.clearRect(0,0,SKIN_SIZE,SKIN_SIZE);
  octx.clearRect(0,0,SKIN_SIZE,SKIN_SIZE);
  redraw();
};

document.getElementById("downloadBtn").onclick=()=>{
  const out=document.createElement("canvas");
  out.width=SKIN_SIZE; out.height=SKIN_SIZE;
  const o=out.getContext("2d");
  o.drawImage(skin,0
